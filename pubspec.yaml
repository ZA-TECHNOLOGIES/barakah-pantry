name: barakah_pantry
description: "Prophetic foods for modern living - Nourishment with Barakah"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  persistent_bottom_nav_bar: ^6.2.1
  supabase_flutter: ^2.12.0
  http: ^1.6.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  shared_preferences: ^2.5.4
  share_plus: ^12.0.1
  flutter_svg: ^2.2.3
  lottie: ^3.3.2
  image_picker: ^1.2.1
  uuid: ^4.5.2
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  equatable: ^2.0.8
  dartz: ^0.10.1
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  change_app_package_name: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/animations/

fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
